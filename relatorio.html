<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Relatório de Recebimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#1C2826; --muted:#5E6B68; --line:#CFD6D3;
  --kraft:#A87A3D; --kraft-soft:#F3E8D8; --stamp:#2A4A94; --stamp-ink:#FFFFFF;
  --ok:#2F7A4B; --err:#B3261E;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141A19; --surface:#1D2523; --ink:#E6ECEA; --muted:#9AA7A4; --line:#33403D;
    --kraft:#D4A566; --kraft-soft:#2E261B; --stamp:#7E9BE0; --stamp-ink:#0F1730;
    --ok:#6CC28C; --err:#F2948D;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141A19; --surface:#1D2523; --ink:#E6ECEA; --muted:#9AA7A4; --line:#33403D;
  --kraft:#D4A566; --kraft-soft:#2E261B; --stamp:#7E9BE0; --stamp-ink:#0F1730;
  --ok:#6CC28C; --err:#F2948D;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 12px;border-bottom:3px solid var(--kraft);margin-bottom:16px;flex-wrap:wrap}
h1{font:700 1.75rem/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
h2{font:700 1.2rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 10px}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
input,select{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
button{font:600 1rem inherit;font-family:inherit;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--kraft);border-color:var(--kraft);color:#fff}
button:disabled{opacity:.6;cursor:default}
.login{max-width:380px;margin:40px auto}
.login .f{margin-bottom:12px}
.err{color:var(--err);min-height:1.4em;margin:8px 0 0;font-size:.95rem}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:16px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--kraft)}
.kpi span{color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.85rem;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:360px;overflow:auto}
.scrollx{overflow-x:auto}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--kraft);vertical-align:middle;margin-left:8px}
.link{background:none;border:0;color:var(--stamp);padding:0;min-height:0;text-decoration:underline;font-weight:500}
.nota{color:var(--muted);font-size:.9rem;margin:8px 0 0}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
#viewer img{max-width:100%;max-height:82vh;border-radius:8px;background:#222}
#viewer button{background:#fff;color:#000}
</style>
</head>
<body>
<div class="wrap">

<section id="telaLogin" class="login card" hidden>
  <h1>Relatório de Recebimento</h1>
  <p style="color:var(--muted);margin:6px 0 16px">Acesso restrito. Entre com seu e-mail e senha.</p>
  <form id="formLogin">
    <div class="f"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="f"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button class="primary" id="btnEntrar" type="submit" style="width:100%">Entrar</button>
    <p class="err" id="erroLogin" role="alert"></p>
  </form>
</section>

<section id="telaRel" hidden>
  <header>
    <div>
      <h1>Relatório de Recebimento de Malas</h1>
      <p>Laboratório HVI · Lucas do Rio Verde</p>
    </div>
    <div class="acoes">
      <button id="btnExcel" class="primary" type="button">Baixar Excel</button>
      <button id="btnSair" type="button">Sair</button>
    </div>
  </header>

  <div class="card filtros">
    <div><label for="fDe">De</label><input id="fDe" type="date"></div>
    <div><label for="fAte">Até</label><input id="fAte" type="date"></div>
    <div><label for="fAlg">Algodoeira</label><select id="fAlg"><option value="">Todas</option></select></div>
    <div><label for="fProd">Produtor</label><select id="fProd"><option value="">Todos</option></select></div>
    <div class="acoes"><button id="btnFiltrar" class="primary" type="button">Aplicar</button><button id="btnHoje" type="button">Hoje</button><button id="btnMes" type="button">Este mês</button></div>
  </div>
  <p class="err" id="erroRel" role="alert"></p>

  <div class="cards">
    <div class="kpi"><b id="kTotal">0</b><span>malas no período</span></div>
    <div class="kpi"><b id="kAlg">0</b><span>algodoeiras</span></div>
    <div class="kpi"><b id="kProd">0</b><span>produtores</span></div>
    <div class="kpi"><b id="kMedia">0</b><span>média por dia com recebimento</span></div>
  </div>

  <div class="grid2">
    <div class="card"><h2>Por algodoeira</h2><div class="scroll"><table id="tAlg"></table></div></div>
    <div class="card"><h2>Por dia</h2><div class="scroll"><table id="tDia"></table></div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><h2>Por produtor</h2><div class="scroll"><table id="tProd"></table></div></div>

  <div class="card">
    <h2>Registros</h2>
    <div class="scrollx"><div class="scroll" style="max-height:560px"><table id="tReg"></table></div></div>
    <p class="nota" id="notaReg"></p>
  </div>
</section>

<div id="viewer" hidden>
  <img id="viewerImg" alt="Protocolo">
  <button id="viewerFechar" type="button">Fechar</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const SUPA_URL = 'https://xwwgsrxzepdgobhbwzfs.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3d2dzcnh6ZXBkZ29iaGJ3emZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MDg2MDksImV4cCI6MjEwOTk4NDYwOX0.6bpITtAqCgs4ZjR29gvkzSmzovRYfkWIVZZ9rokIP4k';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const cmp = (a,b) => String(a).localeCompare(String(b),'pt-BR');

// ---------- sessão ----------
const CH = 'relatorio-malas-sessao';
let sessao = null;
const lerSessao = () => { try{ return JSON.parse(localStorage.getItem(CH) || 'null'); }catch{ return null; } };
const gravarSessao = s => { sessao = s; try{ s ? localStorage.setItem(CH, JSON.stringify(s)) : localStorage.removeItem(CH); }catch{} };

async function authPost(caminho, corpo){
  const r = await fetch(`${SUPA_URL}/auth/v1/${caminho}`, { method:'POST', headers:{ apikey:SUPA_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || ('erro ' + r.status));
  return j;
}
const guardar = j => gravarSessao({ access: j.access_token, refresh: j.refresh_token });
async function renovar(){
  if(!sessao) throw new Error('sem sessão');
  guardar(await authPost('token?grant_type=refresh_token', { refresh_token: sessao.refresh }));
}
async function api(url, opts = {}, tentou = false){
  const r = await fetch(url, { ...opts, headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + sessao.access, ...(opts.headers||{}) } });
  if(r.status === 401 && !tentou){ try{ await renovar(); }catch{ sair(); throw new Error('Sessão expirada. Entre de novo.'); } return api(url, opts, true); }
  return r;
}
function sair(){ gravarSessao(null); dados = []; $('#telaRel').hidden = true; $('#telaLogin').hidden = false; }

$('#formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btnEntrar'); b.disabled = true; b.textContent = 'Entrando…'; $('#erroLogin').textContent = '';
  try{
    guardar(await authPost('token?grant_type=password', { email: $('#email').value.trim(), password: $('#senha').value }));
    $('#senha').value = '';
    await abrir();
  }catch(err){
    $('#erroLogin').textContent = /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + err.message;
  }finally{ b.disabled = false; b.textContent = 'Entrar'; }
});
$('#btnSair').addEventListener('click', sair);

// ---------- dados ----------
let dados = [];
async function buscar(){
  const f = filtros();
  let q = 'select=id,algodoeira,produtor,data,foto_path,criado_em&order=data.desc,criado_em.desc';
  if(f.de) q += '&data=gte.' + f.de;
  if(f.ate) q += '&data=lte.' + f.ate;
  const todos = [], passo = 1000;
  for(let i = 0; ; i += passo){
    const r = await api(`${SUPA_URL}/rest/v1/recebimento_malas?${q}`, { headers: { Range: `${i}-${i+passo-1}`, 'Range-Unit': 'items' } });
    if(!r.ok) throw new Error(r.status === 403 || r.status === 401 ? 'Sem permissão para ler os registros.' : 'Erro ao buscar ' + r.status);
    const lote = await r.json();
    todos.push(...lote);
    if(lote.length < passo) break;
  }
  return todos;
}
function filtros(){ return { de: $('#fDe').value, ate: $('#fAte').value, alg: $('#fAlg').value, prod: $('#fProd').value }; }

function preencherSelect(sel, valores, atual){
  const u = [...new Set(valores)].sort(cmp);
  sel.innerHTML = sel.options[0].outerHTML + u.map(v => `<option>${esc(v)}</option>`).join('');
  sel.value = u.includes(atual) ? atual : '';
}
function contar(lista, chave){
  const m = new Map();
  lista.forEach(r => m.set(r[chave], (m.get(r[chave]) || 0) + 1));
  return [...m.entries()];
}
function tabela(el, cab, linhas, total){
  const max = Math.max(1, ...linhas.map(l => l[1]));
  el.innerHTML = `<thead><tr><th>${cab}</th><th class="n">Malas</th></tr></thead><tbody>` +
    (linhas.length ? linhas.map(([k,n,rot]) => `<tr><td>${esc(rot ?? k)}</td><td class="n">${n}<span class="bar" style="width:${Math.round(n/max*60)}px"></span></td></tr>`).join('') : '<tr><td colspan="2" style="color:var(--muted)">Sem registros no período.</td></tr>') +
    '</tbody>';
}

let visiveis = [];
function render(){
  const f = filtros();
  preencherSelect($('#fAlg'), dados.map(r => r.algodoeira), f.alg);
  preencherSelect($('#fProd'), dados.filter(r => !f.alg || r.algodoeira === f.alg).map(r => r.produtor), f.prod);
  const g = filtros();
  visiveis = dados.filter(r => (!g.alg || r.algodoeira === g.alg) && (!g.prod || r.produtor === g.prod));

  const porAlg = contar(visiveis, 'algodoeira').sort((a,b) => b[1]-a[1] || cmp(a[0],b[0]));
  const porProd = contar(visiveis, 'produtor').sort((a,b) => b[1]-a[1] || cmp(a[0],b[0]));
  const porDia = contar(visiveis, 'data').sort((a,b) => cmp(b[0],a[0])).map(([k,n]) => [k,n,fmt(k)]);

  $('#kTotal').textContent = visiveis.length;
  $('#kAlg').textContent = porAlg.length;
  $('#kProd').textContent = porProd.length;
  $('#kMedia').textContent = porDia.length ? (visiveis.length / porDia.length).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : '0';
  tabela($('#tAlg'), 'Algodoeira', porAlg);
  tabela($('#tProd'), 'Produtor', porProd);
  tabela($('#tDia'), 'Data', porDia);

  $('#tReg').innerHTML = '<thead><tr><th>Data</th><th>Hora</th><th>Algodoeira</th><th>Produtor</th><th>Protocolo</th></tr></thead><tbody>' +
    (visiveis.length ? visiveis.map((r,i) => `<tr><td>${fmt(r.data)}</td><td>${hora(r.criado_em)}</td><td>${esc(r.algodoeira)}</td><td>${esc(r.produtor)}</td><td><button class="link" data-i="${i}">Ver foto</button></td></tr>`).join('') : '<tr><td colspan="5" style="color:var(--muted)">Sem registros no período.</td></tr>') +
    '</tbody>';
  $('#notaReg').textContent = visiveis.length + ' registro(s). Cada registro é uma mala.';
}
const hora = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

async function carregar(){
  $('#erroRel').textContent = '';
  const b = $('#btnFiltrar'); b.disabled = true; b.textContent = 'Carregando…';
  try{ dados = await buscar(); render(); }
  catch(err){ $('#erroRel').textContent = err.message; }
  finally{ b.disabled = false; b.textContent = 'Aplicar'; }
}
async function abrir(){
  $('#telaLogin').hidden = true; $('#telaRel').hidden = false;
  if(!$('#fDe').value){ const h = hoje(); $('#fDe').value = h.slice(0,8) + '01'; $('#fAte').value = h; }
  await carregar();
  if(!sessao) return;
}

$('#btnFiltrar').addEventListener('click', carregar);
$('#btnHoje').addEventListener('click', () => { $('#fDe').value = $('#fAte').value = hoje(); carregar(); });
$('#btnMes').addEventListener('click', () => { const h = hoje(); $('#fDe').value = h.slice(0,8) + '01'; $('#fAte').value = h; carregar(); });
$('#fAlg').addEventListener('change', () => { $('#fProd').value = ''; render(); });
$('#fProd').addEventListener('change', render);

// ---------- foto ----------
$('#tReg').addEventListener('click', async e => {
  const b = e.target.closest('button[data-i]'); if(!b) return;
  const r = visiveis[+b.dataset.i];
  b.textContent = 'Abrindo…';
  try{
    const res = await api(`${SUPA_URL}/storage/v1/object/sign/protocolos-malas/${r.foto_path.split('/').map(encodeURIComponent).join('/')}`, {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ expiresIn: 600 })
    });
    if(!res.ok) throw new Error();
    const j = await res.json();
    $('#viewerImg').src = SUPA_URL + '/storage/v1' + j.signedURL;
    $('#viewer').hidden = false;
  }catch{ $('#erroRel').textContent = 'Não foi possível abrir a foto.'; }
  finally{ b.textContent = 'Ver foto'; }
});
$('#viewerFechar').addEventListener('click', () => { $('#viewer').hidden = true; $('#viewerImg').removeAttribute('src'); });
$('#viewer').addEventListener('click', e => { if(e.target.id === 'viewer') $('#viewerFechar').click(); });

// ---------- Excel ----------
$('#btnExcel').addEventListener('click', () => {
  if(!window.XLSX){ $('#erroRel').textContent = 'Biblioteca do Excel não carregou. Verifique a internet e recarregue.'; return; }
  const f = filtros();
  const wb = XLSX.utils.book_new();
  const regs = visiveis.map(r => ({ Data: fmt(r.data), Hora: hora(r.criado_em), Algodoeira: r.algodoeira, Produtor: r.produtor, 'Arquivo da foto': r.foto_path }));
  const add = (nome, linhas, larg) => { const ws = XLSX.utils.json_to_sheet(linhas); ws['!cols'] = larg.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, nome); };
  add('Registros', regs, [12, 8, 40, 48, 60]);
  add('Por algodoeira', contar(visiveis,'algodoeira').sort((a,b) => b[1]-a[1]).map(([k,n]) => ({ Algodoeira: k, Malas: n })), [40, 10]);
  add('Por produtor', contar(visiveis,'produtor').sort((a,b) => b[1]-a[1]).map(([k,n]) => ({ Produtor: k, Malas: n })), [48, 10]);
  add('Por dia', contar(visiveis,'data').sort((a,b) => cmp(a[0],b[0])).map(([k,n]) => ({ Data: fmt(k), Malas: n })), [12, 10]);
  const nome = `recebimento-malas_${f.de || 'inicio'}_a_${f.ate || 'hoje'}.xlsx`;
  XLSX.writeFile(wb, nome);
});

// ---------- início ----------
(async function(){
  sessao = lerSessao();
  if(!sessao){ $('#telaLogin').hidden = false; return; }
  try{ await abrir(); }catch{ sair(); }
})();
</script>
</body>
</html>
